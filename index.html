<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bordsysteme · 3D · Segelyacht 10 m</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg-0:#05101a; --bg-1:#0a1a28; --panel:rgba(10,24,37,.82);
    --line:rgba(120,170,195,.16); --line-strong:rgba(120,170,195,.32);
    --ink:#dcecf1; --ink-dim:#7f97a3; --ink-faint:#4f6470; --accent:#54ffe0; --accent-dim:rgba(84,255,224,.14); --panel-solid:#0b1b29; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{ font-family:"Space Grotesk",system-ui,-apple-system,sans-serif; color:var(--ink);
    background:radial-gradient(120% 90% at 70% -10%,#10283b 0%,var(--bg-1) 40%,var(--bg-0) 100%);
    -webkit-font-smoothing:antialiased; user-select:none; touch-action:none; }
  #stage{ position:fixed; inset:0; } canvas{ display:block; }
  .topbar{ position:fixed; top:0; left:0; right:0; z-index:8; display:flex; align-items:center; gap:14px; padding:14px 18px; pointer-events:none; }
  .brand{ font-weight:700; font-size:15px; } .brand b{ color:var(--accent); }
  .modes{ margin-left:auto; display:flex; gap:3px; pointer-events:auto; background:var(--panel); border:1px solid var(--line);
    border-radius:11px; padding:3px; backdrop-filter:blur(14px); max-width:70vw; overflow-x:auto; scrollbar-width:none; }
  .modes::-webkit-scrollbar{ display:none; }
  .mode-btn{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-dim); padding:7px 12px; border-radius:8px; cursor:pointer; transition:.14s; white-space:nowrap; }
  .mode-btn:hover{ color:var(--ink); } .mode-btn.active{ background:var(--accent); color:#04131a; font-weight:600; }
  .panel{ position:fixed; z-index:6; background:var(--panel); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(14px) saturate(1.1); box-shadow:0 18px 50px -20px rgba(0,0,0,.7); }
  .panel-head{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-dim); padding:13px 15px 9px; }
  #leftPanel{ left:16px; top:66px; width:224px; max-height:calc(100vh - 96px); overflow-y:auto; }
  .sys-row{ display:flex; align-items:center; gap:10px; padding:8px 15px; cursor:pointer; transition:background .12s; }
  .sys-row:hover{ background:rgba(255,255,255,.03); }
  .sys-row .dot{ width:11px; height:11px; border-radius:3px; flex:none; box-shadow:0 0 9px -1px currentColor; }
  .sys-row .name{ font-size:13px; flex:1; } .sys-row .count{ font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-faint); }
  .sys-row.off{ opacity:.34; } .sys-row.off .dot{ box-shadow:none; }
  .sys-row.pick.sel{ background:var(--accent-dim); } .sys-row.pick.sel .name{ color:var(--accent); }
  .foot{ padding:9px 15px 12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .mini-btn{ flex:1; text-align:center; cursor:pointer; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-dim); padding:6px; border-radius:6px; border:1px solid var(--line); transition:.12s; }
  .mini-btn:hover{ color:var(--ink); border-color:var(--line-strong); }
  .add-row{ padding:10px 15px 4px; display:flex; flex-direction:column; gap:6px; }
  .add-btn{ text-align:center; cursor:pointer; font-size:12px; color:var(--accent); padding:8px; border-radius:8px; border:1px dashed var(--line-strong); transition:.12s; }
  .add-btn:hover{ border-color:var(--accent); background:var(--accent-dim); }
  .swrow{ display:flex; align-items:center; gap:10px; padding:7px 15px; }
  .swrow .ldot{ width:8px; height:8px; border-radius:2px; flex:none; }
  .swrow .lname{ font-size:12.5px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toggle{ width:34px; height:19px; border-radius:20px; background:#2a3946; position:relative; cursor:pointer; flex:none; transition:background .16s; border:1px solid var(--line); }
  .toggle::after{ content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#8397a2; transition:.16s; }
  .toggle.on{ background:var(--accent); } .toggle.on::after{ left:16px; background:#04131a; }
  .seg{ display:flex; gap:4px; padding:2px 15px 8px; }
  .sgb{ flex:1; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:11px; padding:6px; border-radius:7px; border:1px solid var(--line); color:var(--ink-dim); cursor:pointer; }
  .sgb.on{ background:var(--accent); color:#04131a; border-color:var(--accent); }
  .big-file{ margin:2px 15px 12px; text-align:center; padding:12px; border:1px dashed var(--line-strong); border-radius:9px; color:var(--ink); cursor:pointer; font-size:12.5px; }
  .big-file:hover{ border-color:var(--accent); color:var(--accent); }
  .ctrl{ display:flex; align-items:center; gap:10px; padding:5px 15px; }
  .ctrl label{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); width:70px; }
  .note{ padding:0 15px 12px; font-size:11.5px; line-height:1.5; color:var(--ink-dim); }
  input[type=range]{ -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:3px; background:var(--line-strong); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:15px; height:15px; border:none; border-radius:50%; background:var(--accent); cursor:pointer; }
  #detail{ right:16px; top:66px; width:276px; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .2s,transform .2s; max-height:calc(100vh - 96px); overflow-y:auto; }
  #detail.show{ opacity:1; transform:none; pointer-events:auto; }
  .d-title{ padding:14px 16px 3px; font-size:17px; font-weight:600; }
  .d-type{ padding:0 16px 12px; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); }
  .d-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:3px 9px 3px 7px; border-radius:20px; border:1px solid var(--line-strong); background:rgba(255,255,255,.02); }
  .chip .dot{ width:8px; height:8px; border-radius:2px; }
  .d-desc{ padding:0 16px 14px; font-size:13px; line-height:1.55; color:#b9cdd5; }
  .prod{ margin:0 16px 14px; padding:11px 12px; border:1px solid var(--line-strong); border-radius:9px; background:rgba(255,255,255,.02); }
  .prod-name{ font-size:13px; font-weight:600; color:var(--ink); }
  .prod-note{ font-size:12px; color:var(--ink-dim); margin-top:4px; line-height:1.45; }
  .prod-link{ display:inline-block; margin-top:7px; font-size:12px; color:var(--accent); text-decoration:none; font-family:"IBM Plex Mono",monospace; }
  .prod-link:hover{ text-decoration:underline; }
  .txt+.txt{ margin-top:6px; }
  .d-extra{ padding:0 16px; } .d-extra.pad{ padding:2px 16px 14px; border-top:1px solid var(--line); }
  .edit-lab{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-dim); padding:11px 0 5px; }
  .txt{ width:100%; background:rgba(255,255,255,.04); border:1px solid var(--line-strong); border-radius:7px; color:var(--ink); font-family:inherit; font-size:13px; padding:7px 9px; outline:none; }
  .txt:focus{ border-color:var(--accent); }
  .systog{ display:flex; flex-wrap:wrap; gap:5px; }
  .stog{ display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px; border-radius:16px; border:1px solid var(--line-strong); cursor:pointer; opacity:.4; transition:.12s; }
  .stog.on{ opacity:1; } .stog .dot{ width:8px; height:8px; border-radius:2px; }
  .slider-row{ display:flex; align-items:center; gap:10px; padding:11px 0 4px; }
  .slider-row label{ font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.07em; width:44px; }
  .coord{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-faint); padding:2px 0 6px; }
  .row-btns{ padding:12px 0 4px; } .row-btns .mini-btn{ border-color:#7c3b3b; color:#ff9a9a; }
  .bigswitch{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0 14px; }
  .simstat{ display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; padding:3px 9px; border-radius:6px; margin-top:2px; }
  .simstat.on{ color:#04131a; background:var(--accent); } .simstat.off{ color:var(--ink-dim); border:1px solid var(--line-strong); }
  .d-conn-head{ padding:11px 16px 4px; border-top:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); }
  .conn-list{ padding:2px 10px 12px; max-height:140px; overflow:auto; }
  .conn-item{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:7px; cursor:pointer; font-size:13px; transition:background .12s; }
  .conn-item:hover{ background:rgba(255,255,255,.04); } .conn-item .bar{ width:3px; height:15px; border-radius:2px; flex:none; } .conn-item .arrow{ color:var(--ink-faint); margin-left:auto; font-size:12px; }
  #hint{ left:16px; bottom:16px; padding:11px 15px; width:246px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.75; color:var(--ink-dim); }
  #hint b{ color:var(--ink); font-weight:500; } #hint .k{ color:var(--accent); }
  .botbar{ position:fixed; right:16px; bottom:16px; z-index:6; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:62vw; }
  .pbtn{ padding:10px 14px; cursor:pointer; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink); background:var(--panel); border:1px solid var(--line-strong); border-radius:10px; backdrop-filter:blur(14px); white-space:nowrap; }
  .pbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .pbtn.primary{ background:var(--accent); color:#04131a; border-color:var(--accent); font-weight:600; }
  .pbtn.primary:hover{ filter:brightness(1.08); color:#04131a; }
  @media (max-width:760px){ .pbtn{ padding:9px 10px; } }
  .scrim{ scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; } .scrim::-webkit-scrollbar{ width:6px; } .scrim::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:3px; }
  @media (max-width:760px){ #leftPanel{ width:188px; top:58px; } #detail{ width:222px; top:58px; } #hint{ display:none; } .brand{ font-size:12px; } .mode-btn{ padding:7px 8px; font-size:10px; } }

  /* Bootswechsler */
  .boatbar{ display:flex; align-items:center; gap:6px; pointer-events:auto; }
  .boatsel{ background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:6px 8px; font-family:"IBM Plex Mono",monospace; font-size:11px; max-width:150px; }
  .iconbtn{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--panel); border:1px solid var(--line); border-radius:9px; color:var(--ink-dim); font-size:14px; }
  .iconbtn:hover{ color:var(--accent); border-color:var(--line-strong); }
  .iconbtn.off{ opacity:.35; pointer-events:none; }

  /* Eingaben in Auswertungstabellen */
  .tin{ width:72px; background:rgba(255,255,255,.04); border:1px solid var(--line-strong); border-radius:6px; color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:12px; padding:4px 6px; text-align:right; outline:none; }
  .tin:focus{ border-color:var(--accent); } .tin::placeholder{ color:var(--ink-faint); }
  .rep-set{ display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:14px; font-size:12px; color:var(--ink-dim); }
  .rep-set .seg{ padding:0; } .rep-set .sgb{ flex:none; padding:5px 10px; }
  .warn{ color:#ffb36b; } .bad{ color:#ff9a9a; } .ok{ color:var(--accent); }
  table.rep h4{ font-size:12px; }
  .tpl-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin:6px 0 14px; }
  .tpl{ border:1px solid var(--line-strong); border-radius:10px; padding:10px 12px; cursor:pointer; background:rgba(255,255,255,.02); transition:.12s; }
  .tpl:hover{ border-color:var(--accent); background:var(--accent-dim); }
  .tpl-n{ font-weight:600; font-size:13.5px; } .tpl-m{ font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-dim); margin-top:3px; }
  .tpl-d{ font-size:12px; color:#b9cdd5; margin-top:6px; line-height:1.45; } .tpl-s{ font-size:10.5px; color:var(--ink-faint); margin-top:6px; } .tpl-s a{ color:var(--accent); margin-right:4px; }
  .pstat{ display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px; padding:2px 7px; border-radius:5px; border:1px solid var(--line-strong); color:var(--ink-dim); }
  .pstat.verbaut{ color:var(--accent); border-color:rgba(84,255,224,.35); } .pstat.geplant{ color:#8bb8ff; border-color:rgba(139,184,255,.4); }
  .pstat.bestellt{ color:#ffb36b; border-color:rgba(255,179,107,.4); } .pstat.ausgebaut{ color:var(--ink-faint); }
  tr.gone td{ opacity:.45; } select.txt option{ background:#0b1b29; color:var(--ink); } select.txt{ margin-bottom:6px; }

  /* Foto im Detail */
  .photo{ margin:0 16px 12px; border-radius:9px; overflow:hidden; border:1px solid var(--line-strong); }
  .photo img{ display:block; width:100%; }
  .photo-edit{ display:flex; gap:6px; margin-top:6px; margin-bottom:12px; }
  .gal{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
  .gal:empty{ display:none; }
  .gth{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; border:1px solid var(--line-strong); cursor:pointer; display:block; background:#0b1b29; }
  .gth:hover{ border-color:var(--accent); }
  .tk-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tk-grid .txt{ margin-top:0; }

  /* Szenarien */
  .scen-row{ display:flex; align-items:center; gap:6px; padding:6px 15px; }
  .scen-row .snm{ flex:1; font-size:12.5px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scen-row .snm:hover{ color:var(--accent); }
  .scen-row .del{ cursor:pointer; color:var(--ink-faint); font-size:14px; }
  .scen-row .del:hover{ color:#ff9a9a; }

  /* Auswertungs-Modal */
  .modal{ position:fixed; inset:0; z-index:20; background:rgba(3,10,16,.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; }
  .modal.show{ display:flex; }
  .modal-card{ width:min(880px,94vw); max-height:88vh; display:flex; flex-direction:column; background:var(--panel-solid); border:1px solid var(--line-strong); border-radius:14px; overflow:hidden; box-shadow:0 30px 80px -20px rgba(0,0,0,.8); }
  .modal-top{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .modal-top .mt-title{ font-weight:700; font-size:15px; }
  .modal-top .mt-x{ margin-left:auto; cursor:pointer; color:var(--ink-dim); font-size:20px; line-height:1; }
  .modal-top .mt-x:hover{ color:var(--ink); }
  .tabs{ display:flex; gap:4px; padding:10px 16px 0; flex-wrap:wrap; }
  .tab{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-dim); padding:7px 12px; border-radius:8px 8px 0 0; cursor:pointer; }
  .tab.on{ background:rgba(255,255,255,.04); color:var(--accent); border:1px solid var(--line); border-bottom:none; }
  .rep-body{ padding:16px; overflow:auto; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .stat{ background:rgba(255,255,255,.02); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat .k{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); }
  .stat .v{ font-size:22px; font-weight:600; margin-top:3px; } .stat .v small{ font-size:12px; color:var(--ink-dim); font-weight:400; }
  table.rep{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rep th{ text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); padding:8px 8px; border-bottom:1px solid var(--line-strong); }
  table.rep td{ padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.rep td a{ color:var(--accent); text-decoration:none; } table.rep td a:hover{ text-decoration:underline; }
  table.rep .num{ text-align:right; font-family:"IBM Plex Mono",monospace; }
  .rep-note{ font-size:11.5px; color:var(--ink-dim); margin-top:10px; line-height:1.5; }
  .modal-foot{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .modal-foot .spacer{ flex:1; }

  @media print{
    body>*{ display:none !important; }
    #report{ display:block !important; position:static; background:#fff; inset:auto; }
    #report .modal-card{ box-shadow:none; border:none; max-height:none; width:100%; background:#fff; color:#111; }
    #report .modal-top,.tabs,.modal-foot{ display:none !important; }
    #report .rep-body{ overflow:visible; color:#111; }
    #report .stat,#report table.rep th,#report table.rep td{ color:#111 !important; border-color:#bbb !important; }
    #report .stat .k,#report .rep-note,#report table.rep th{ color:#444 !important; }
    #report .print-only{ display:block !important; }
  }
  .print-only{ display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<input type="file" id="planFile" accept="image/*" style="display:none">
<div class="topbar">
  <div class="brand"><b>◈</b> Bordsysteme</div>
  <div class="boatbar" style="pointer-events:auto">
    <select class="boatsel" id="boatSel"></select>
    <div class="iconbtn" id="boatNew" title="Neues Boot">＋</div>
    <div class="iconbtn" id="boatRen" title="Umbenennen">✎</div>
    <div class="iconbtn" id="boatDel" title="Boot löschen">🗑</div>
    <div class="iconbtn off" id="undoBtn" title="Rückgängig (Strg+Z)">↶</div>
    <div class="iconbtn off" id="redoBtn" title="Wiederholen (Strg+Y)">↷</div>
  </div>
  <div class="modes" id="modes">
    <div class="mode-btn active" data-mode="view">Ansicht</div>
    <div class="mode-btn" data-mode="plan">Plan</div>
    <div class="mode-btn" data-mode="move">Verschieben</div>
    <div class="mode-btn" data-mode="connect">Verbinden</div>
    <div class="mode-btn" data-mode="sim">Simulation</div>
  </div>
  <div class="boatbar" style="pointer-events:auto">
    <span id="syncStat" style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);white-space:nowrap"></span>
    <a class="iconbtn" id="logoutBtn" title="Abmelden" href="/outpost.goauthentik.io/sign_out" style="display:none;text-decoration:none">⎋</a>
  </div>
</div>
<div class="panel scrim" id="leftPanel"></div>
<div class="panel scrim" id="detail">
  <div class="d-title" id="dTitle"></div><div class="d-type" id="dType"></div>
  <div class="d-chips" id="dChips"></div><div class="d-desc" id="dDesc"></div>
  <div class="d-extra" id="dExtra"></div>
  <div class="d-conn-head">Verbunden mit</div><div class="conn-list scrim" id="dConns"></div>
</div>
<div class="panel" id="hint"></div>
<input type="file" id="stateFile" accept="application/json,.json" style="display:none">
<input type="file" id="photoFile" accept="image/*" multiple style="display:none">
<input type="file" id="camFile" accept="image/*" capture="environment" style="display:none">
<div class="modal" id="lbModal">
  <div class="modal-card" style="width:min(1000px,96vw)">
    <div class="modal-top"><span class="mt-title" id="lbTitle"></span><span class="mt-x" id="lbX">×</span></div>
    <div class="rep-body" style="text-align:center;padding:10px"><img id="lbImg" alt="" style="max-width:100%;max-height:62vh;border-radius:8px"></div>
    <div class="modal-foot" style="flex-wrap:wrap;align-items:center">
      <div class="mini-btn" id="lbPrev" style="flex:none;padding:8px 12px">‹</div><div class="mini-btn" id="lbNext" style="flex:none;padding:8px 12px">›</div>
      <input class="txt" id="lbCap" placeholder="Beschreibung (z. B. Typenschild, Einbau 2024)" style="flex:1;min-width:160px;width:auto">
      <input class="txt" id="lbAt" placeholder="Datum" style="width:110px">
      <a class="mini-btn" id="lbOpen" target="_blank" rel="noopener" style="flex:none;padding:8px 12px;text-decoration:none">Original ↗</a>
      <div class="mini-btn" id="lbFirst" style="flex:none;padding:8px 12px">Als Titelbild</div>
      <div class="mini-btn" id="lbDel" style="flex:none;padding:8px 12px;border-color:#7c3b3b;color:#ff9a9a">Löschen</div>

function halfBeamAt(s){ const m=HULL.beam/2;
  if(s>HULL.bow){ const t=Math.max(0,(1-s)/(1-HULL.bow)); return m*Math.pow(t,HULL.bowPow); }   // Bug

    const luk=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.02,8,22),new THREE.MeshBasicMaterial({color:0x6f9ab0,transparent:true,opacity:0.4}));

    solid(new THREE.BoxGeometry(0.4,0.6,0.08),0.55,-0.75,0);                                          // Ruder

  else if(repTab==='leitungen'){ const per=lineLengths(),keys=Object.keys(per); let total=0; keys.forEach(k=>total+=per[k]);
    h+=`<div class="stat-grid"><div class="stat"><div class="k">Gesamtlänge (Luftlinie)</div><div class="v">${fmt(total,1)} <small>m</small></div></div>
      <div class="stat"><div class="k">Maßstab</div><div class="v">${fmt(boatLengthM,1)} <small>m Bootslänge</small></div></div></div>
      <table class="rep"><thead><tr><th>System</th><th class="num">Länge</th></tr></thead><tbody>`;
    keys.forEach(k=>{ h+=`<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${SYSTEMS[k].color};margin-right:7px"></span>${SYSTEMS[k].name}</td><td class="num">${fmt(per[k],1)} m</td></tr>`; });
    if(!keys.length) h+=`<tr><td colspan="2" style="color:var(--ink-faint)">Keine Leitungen vorhanden.</td></tr>`;
    h+=`</tbody></table><div class="rep-note">Grobe Luftlinien aus der 3D-Geometrie × Maßstab. Reale Kabel-/Schlauchwege sind länger — plane Zuschlag ein (für ${ELEC.volt}-V-Kabel unter „Kabel &amp; Sicherungen“ berücksichtigt). Maßstab im Plan-Modus über „Bootslänge“ einstellen.</div>`; }
  else h+=partsReport();
  const body=document.getElementById('repBody'); body.innerHTML=h;
  const num=v=>{ const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:0; };
  body.querySelectorAll('[data-volt]').forEach(b=>b.onclick=()=>setElec('volt',parseInt(b.dataset.volt)));
  body.querySelectorAll('[data-bat]').forEach(b=>b.onclick=()=>setElec('bat',b.dataset.bat));
  const ed=body.querySelector('#eDrop'); if(ed) ed.onchange=()=>{ const v=num(ed.value); setElec('dropPct',v>0&&v<=20?v:ELEC_DEF.dropPct); };
  const er=body.querySelector('#eRoute'); if(er) er.onchange=()=>{ const v=num(er.value); setElec('route',v>=1&&v<=5?v:ELEC_DEF.route); };
  if(repTab==='teile') bindParts(body);
  if(repTab==='kabel'){ const list=connObjs.filter(o=>o.sys==='dc12');
    body.querySelectorAll('input[data-k]').forEach(inp=>inp.onchange=()=>{ setConnVal(list[+inp.dataset.i],inp.dataset.k,num(inp.value)); renderReport(); }); }
}

/* ---- Fotos je Bauteil: beliebig viele, aus der Galerie oder mit der Kamera ----
   Dateien liegen auf dem Server (api/photo, Vollbild ≤ 1600 px + Vorschau), im Stand nur {id, cap, at}.
   Noch nicht hochgeladene Fotos (offline, alte Einzelfotos, Backup-Import) stehen als {data} im Stand und werden nachgeladen. */
const PHOTO_FULL=1600, PHOTO_THUMB=360;
let photoTarget=null, lbComp=null, lbIx=0, camStream=null;
function photoSrc(p,thumb){ return p.id?`api/photo/${p.id}${thumb?'_t':''}.jpg`:p.data; }
async function loadBitmap(file){ if(window.createImageBitmap){ try{ return await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(e){} }
  return await new Promise((ok,err)=>{ const u=URL.createObjectURL(file), img=new Image(); img.onload=()=>{ URL.revokeObjectURL(u); ok(img); }; img.onerror=err; img.src=u; }); }
function toJpeg(src,max,q){ const sc=Math.min(1,max/Math.max(src.width,src.height)), cv=document.createElement('canvas');
  cv.width=Math.round(src.width*sc); cv.height=Math.round(src.height*sc); cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height); return cv.toDataURL('image/jpeg',q); }
function thumbOf(dataUrl){ return new Promise((ok,err)=>{ const img=new Image(); img.onload=()=>ok(toJpeg(img,PHOTO_THUMB,0.75)); img.onerror=err; img.src=dataUrl; }); }
async function uploadPhoto(full,thumb){ const r=await fetch('api/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full,thumb})});
  if(!r.ok) throw new Error('HTTP '+r.status); return (await r.json()).id; }
async function addPhotos(c,files){ files=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name)); if(!files.length) return;
  c.photos=c.photos||[]; let n=0, offline=0;
  for(const f of files){ setSync(`Foto ${++n}/${files.length} wird gespeichert…`);
    try{ const bmp=await loadBitmap(f), full=toJpeg(bmp,PHOTO_FULL,0.85), thumb=toJpeg(bmp,PHOTO_THUMB,0.75); if(bmp.close) bmp.close();
      const at=new Date(f.lastModified||Date.now()).toISOString().slice(0,10);
      try{ c.photos.push({id:await uploadPhoto(full,thumb),at}); }catch(e){ console.error(e); c.photos.push({data:full,at}); offline++; } }
    catch(e){ console.error(e); alert('„'+f.name+'“ konnte nicht gelesen werden – bitte als JPG/PNG versuchen.'); } }
  markDirty(); if(selected===c) renderDetail(c);
  if(offline) setTimeout(()=>setSync(offline+' Foto(s) noch nicht auf dem Server – neuer Versuch beim nächsten Laden'),1500); }
async function migratePhotos(){ let changed=false;
  for(const c of COMPONENTS) for(const p of (c.photos||[])){ if(p.id||!p.data) continue;
    try{ p.id=await uploadPhoto(p.data,await thumbOf(p.data)); delete p.data; changed=true; }catch(e){ console.error(e); return; } }
  if(changed){ markDirty(); if(selected) renderDetail(selected); } }
function galleryHtml(c){ const ps=c.photos||[];
  return `<div class="gal">${ps.map((p,i)=>`<img class="gth" data-i="${i}" src="${esc(photoSrc(p,true))}" title="${esc(p.cap||'Foto '+(i+1))}" alt="" loading="lazy">`).join('')}</div>
    <div class="photo-edit"><div class="mini-btn" id="galAdd">🖼 Fotos wählen</div><div class="mini-btn" id="galCam">📷 Aufnehmen</div></div>`; }
function bindGallery(c){ const a=document.getElementById('galAdd'); if(!a) return;
  a.onclick=()=>{ photoTarget=c; document.getElementById('photoFile').click(); };
  document.getElementById('galCam').onclick=()=>openCamera(c);
  document.querySelectorAll('#detail .gth').forEach(t=>t.onclick=()=>openLightbox(c,+t.dataset.i)); }
const pickFiles=e=>{ const fs=[...e.target.files]; e.target.value=''; if(photoTarget) addPhotos(photoTarget,fs); };
document.getElementById('photoFile').onchange=pickFiles;
document.getElementById('camFile').onchange=pickFiles;
/* Kamera: am Handy/Tablet die Kamera-App (capture), am PC die Webcam im Fenster (mehrere Aufnahmen hintereinander) */
async function openCamera(c){ photoTarget=c;
  if(matchMedia('(pointer:coarse)').matches||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) return document.getElementById('camFile').click();
  const m=document.getElementById('camModal'), v=document.getElementById('camVid'), msg=document.getElementById('camMsg'); m.classList.add('show'); msg.textContent='Kamera wird gestartet…';
  try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false}); v.srcObject=camStream;
    msg.textContent=`Für „${c.name}“ – mehrere Aufnahmen möglich, jede wird sofort gespeichert.`; }
  catch(e){ msg.textContent='Keine Kamera verfügbar oder Zugriff verweigert ('+e.name+'). Stattdessen „Fotos wählen“ nutzen.'; } }
function closeCamera(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } document.getElementById('camVid').srcObject=null; document.getElementById('camModal').classList.remove('show'); }
document.getElementById('camShot').onclick=()=>{ const v=document.getElementById('camVid'); if(!camStream||!v.videoWidth) return;
  const cv=document.createElement('canvas'); cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext('2d').drawImage(v,0,0);
  cv.toBlob(b=>{ if(b&&photoTarget) addPhotos(photoTarget,[new File([b],'kamera.jpg',{type:'image/jpeg',lastModified:Date.now()})]); },'image/jpeg',0.92);
  document.getElementById('camMsg').textContent='✓ Aufgenommen – weiteres Foto möglich oder „Fertig“.'; };
document.getElementById('camDone').onclick=closeCamera; document.getElementById('camX').onclick=closeCamera;
/* Großansicht: blättern, Beschreibung/Datum, Titelbild, löschen */
const lbModal=document.getElementById('lbModal');
function openLightbox(c,i){ lbComp=c; lbIx=i; lbModal.classList.add('show'); showLb(); }
function showLb(){ const ps=lbComp.photos||[]; if(!ps.length) return closeLb(); lbIx=(lbIx+ps.length)%ps.length; const p=ps[lbIx];
  document.getElementById('lbTitle').textContent=`${lbComp.name} · Foto ${lbIx+1} von ${ps.length}`; document.getElementById('lbImg').src=photoSrc(p,false);
  document.getElementById('lbCap').value=p.cap||''; document.getElementById('lbAt').value=p.at||'';
  const o=document.getElementById('lbOpen'); o.href=photoSrc(p,false); o.style.display=p.id?'':'none'; }
function closeLb(){ lbModal.classList.remove('show'); if(lbComp&&selected===lbComp) renderDetail(lbComp); lbComp=null; }
document.getElementById('lbX').onclick=closeLb;
lbModal.addEventListener('click',e=>{ if(e.target===lbModal) closeLb(); });
document.getElementById('lbPrev').onclick=()=>{ lbIx--; showLb(); };
document.getElementById('lbNext').onclick=()=>{ lbIx++; showLb(); };
document.getElementById('lbCap').oninput=e=>{ const p=lbComp.photos[lbIx]; p.cap=e.target.value||undefined; markDirty(); };
document.getElementById('lbAt').oninput=e=>{ const p=lbComp.photos[lbIx]; p.at=e.target.value||undefined; markDirty(); };
document.getElementById('lbFirst').onclick=()=>{ const ps=lbComp.photos; ps.unshift(ps.splice(lbIx,1)[0]); lbIx=0; markDirty(); showLb(); };
document.getElementById('lbDel').onclick=()=>{ if(!confirm('Dieses Foto vom Bauteil entfernen?')) return; lbComp.photos.splice(lbIx,1); if(!lbComp.photos.length) lbComp.photos=undefined; markDirty(); showLb(); };
addEventListener('keydown',e=>{ if(!lbModal.classList.contains('show')||e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft'){ lbIx--; showLb(); } else if(e.key==='ArrowRight'){ lbIx++; showLb(); } else if(e.key==='Escape') closeLb(); });
/* ---- Verdrahtung ---- */

document.getElementById('imgBtn').onclick=exportImage;

document.getElementById('repPrint').onclick=()=>window.print();

/* ============================================================ SPEICHERUNG AUF DEM HEIMSERVER ============================================================
   Dienst bordsysteme-api auf CT 210 (über Caddy unter /api/*). Ganzer Stand = Backup-Format (version 3, alle Boote mit fester id).
   GET api/state -> {rev,saved,by,data} · PUT api/state {rev,data} -> {rev} | 409 + aktueller Stand (anderes Gerät war schneller).
   Bei 409 wird pro Boot zusammengeführt: hat nur eine Seite das Boot geändert, gewinnt sie; haben beide es geändert,
   bleibt die Server-Fassung und die eigene kommt als Kopie „(Konflikt …)“ dazu. */
const syncStat=document.getElementById('syncStat');
function setSync(txt){ syncStat.textContent=txt; }
let serverRev=0, loaded=false, saveTimer=null, saving=null, baseKeys=new Map();
function fileData(){ captureBoat(); return { version:3, activeBoat:boatIx, boats:BOATS.map(b=>({id:b.id,name:b.name,state:b.state})) }; }
function boatKey(b){ return JSON.stringify({n:b.name,s:Object.assign({},b.state,{camera:null})}); }     // Kameraposition zählt nicht als Änderung
function setBase(boats){ baseKeys=new Map(boats.map(b=>[b.id,boatKey(b)])); }
function withIds(boats){ return boats.map(b=>({id:b.id||newBoatId(),name:b.name||'Boot',state:b.state})); }
function scheduleSave(){ if(!loaded) return; clearTimeout(saveTimer); setSync('Ungespeicherte Änderungen'); saveTimer=setTimeout(saveToServer,1200); }
async function flushSave(){ clearTimeout(saveTimer); captureBoat(); if(dirty&&loaded) await saveToServer(); }
function applyServer(st){ serverRev=st.rev; const f=st.data; let needIds=false;
  if(f&&Array.isArray(f.boats)&&f.boats.length){ needIds=f.boats.some(b=>!b.id); BOATS=withIds(f.boats); boatIx=Math.max(0,Math.min(f.activeBoat||0,BOATS.length-1));
    applyBoatState(BOATS[boatIx].state); renderBoatSwitcher(); resetUndo(); setBase(needIds?[]:BOATS); }
  if(st.saved) syncStat.title='Zuletzt gespeichert '+fmtTime(st.saved)+(st.by?' von '+st.by:'');
  dirty=needIds; }
function mergeBoats(S,Lc){ const sm=new Map(S.map(b=>[b.id,b])), lm=new Map(Lc.map(b=>[b.id,b])), out=[]; let conflicts=0;
  const ids=[...S.map(b=>b.id),...Lc.map(b=>b.id).filter(id=>!sm.has(id))];
  ids.forEach(id=>{ const s=sm.get(id), l=lm.get(id), base=baseKeys.get(id), ks=s&&boatKey(s), kl=l&&boatKey(l);
    if(s&&l){ if(ks===kl||kl===base) out.push(s); else if(ks===base) out.push(l);
      else { out.push(s); out.push({id:newBoatId(),name:l.name+' (Konflikt '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+')',state:l.state}); conflicts++; } }
    else if(s){ if(!(base!==undefined&&ks===base)) out.push(s); }   // hier gelöscht, auf dem Server unverändert → bleibt gelöscht
    else if(l){ if(!(base!==undefined&&kl===base)) out.push(l); } }); // auf dem Server gelöscht, hier unverändert → weg
  return {boats:out.length?out:S,conflicts}; }
function takeMerged(cur){ const S=withIds((cur.data&&cur.data.boats)||[]), curId=BOATS[boatIx]&&BOATS[boatIx].id, local=fileData().boats;
  const before=boatKey(BOATS[boatIx]), {boats,conflicts}=mergeBoats(S,local);
  BOATS=boats; const ix=BOATS.findIndex(b=>b.id===curId); boatIx=ix<0?0:ix;
  if(ix<0||boatKey(BOATS[boatIx])!==before){ const keep={theta:cam.theta,phi:cam.phi,radius:cam.radius};
    undoMuted=true; applyBoatState(Object.assign({},BOATS[boatIx].state,{camera:keep})); undoMuted=false; resetUndo(); }
  renderBoatSwitcher(); serverRev=cur.rev; setBase(S); return conflicts; }
async function saveToServer(){ clearTimeout(saveTimer); if(saving){ await saving; if(!dirty) return; }
  saving=(async()=>{ setSync('Speichert…'); dirty=false; const data=fileData();
    try{ const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:serverRev,data})});
      if(r.status===409){ const conflicts=takeMerged(await r.json()); dirty=true;
        setSync(conflicts?'Gleichzeitig geändert – Kopie „(Konflikt …)“ angelegt':'Mit Änderungen von anderem Gerät zusammengeführt'); saveTimer=setTimeout(saveToServer,300); return; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      serverRev=(await r.json()).rev; setBase(data.boats); setSync(dirty?'Ungespeicherte Änderungen':'Auf dem Server gespeichert'); }
    catch(err){ console.error(err); dirty=true; setSync('Server nicht erreichbar – neuer Versuch …'); saveTimer=setTimeout(saveToServer,10000); } })();
  await saving; saving=null; }
async function loadFromServer(){ setSync('Lädt…');
  try{ const r=await fetch('api/state',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const st=await r.json();
    loaded=true;
    if(st.data){ applyServer(st); if(dirty) await saveToServer(); else setSync('Auf dem Server gespeichert'); }
    else { serverRev=st.rev; setBase([]); resetUndo(); dirty=true; await saveToServer(); } }
  catch(err){ console.error(err); setSync('Server nicht erreichbar – neuer Versuch …'); setTimeout(loadFromServer,10000); } }
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&dirty&&loaded) saveToServer(); });

/* ---- Verlauf: Schnappschüsse auf dem Server (höchstens alle 10 Min einer, letzte 300) ---- */
const histModal=document.getElementById('histModal');
function fmtTime(s){ if(!s) return '–'; const d=new Date(s); return isNaN(d)?s:d.toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}); }
async function openHistory(){ histModal.classList.add('show'); const body=document.getElementById('histBody'); body.innerHTML='<div class="note">Lädt…</div>';
  try{ const r=await fetch('api/history',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const list=await r.json();
    if(!list.length){ body.innerHTML='<div class="note">Noch keine älteren Stände. Der Server legt beim Speichern höchstens alle 10 Minuten einen an.</div>'; return; }
    body.innerHTML=`<table class="rep"><thead><tr><th>Gespeichert</th><th>Boote</th><th>von</th><th></th></tr></thead><tbody>${list.map(e=>`<tr>
      <td style="white-space:nowrap">${esc(fmtTime(e.saved))}<div style="color:var(--ink-faint);font-size:11px">Stand ${e.rev} · ${fmt(e.size/1024,0)} KB</div></td>
      <td>${esc((e.boats||[]).join(', '))||'–'}</td><td>${esc(e.by||'–')}</td>
      <td style="text-align:right"><span class="mini-btn" data-f="${esc(e.file)}" style="display:inline-block;padding:5px 10px">Wiederherstellen</span></td></tr>`).join('')}</tbody></table>
      <div class="rep-note">Wiederherstellen ersetzt den ganzen Stand (alle Boote). Der jetzige Stand wird vorher selbst im Verlauf gesichert und lässt sich genauso zurückholen.</div>`;
    body.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>restoreHistory(b.dataset.f)); }
  catch(err){ console.error(err); body.innerHTML='<div class="note bad">Verlauf nicht erreichbar.</div>'; } }
async function restoreHistory(file){ if(!confirm('Diesen Stand wiederherstellen? Alle Boote werden ersetzt – der jetzige Stand bleibt im Verlauf.')) return;
  await flushSave();
  try{ const s=await fetch('api/history/'+encodeURIComponent(file),{cache:'no-store'}); if(!s.ok) throw new Error('HTTP '+s.status);
    const data=(await s.json()).data; data.boats=withIds(data.boats||[]);
    const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:serverRev,data,restore:true})});
    if(r.status===409){ alert('Inzwischen hat ein anderes Gerät gespeichert – der neue Stand wird geladen, dann bitte erneut wiederherstellen.'); histModal.classList.remove('show'); return loadFromServer(); }
    if(!r.ok) throw new Error('HTTP '+r.status);
    applyServer({rev:(await r.json()).rev,data}); setBase(BOATS); dirty=false; setSync('Stand wiederhergestellt'); histModal.classList.remove('show'); }
  catch(err){ console.error(err); alert('Wiederherstellen fehlgeschlagen: '+err.message); } }
document.getElementById('histBtn').onclick=openHistory;
document.getElementById('histX').onclick=()=>histModal.classList.remove('show');
histModal.addEventListener('click',e=>{ if(e.target===histModal) histModal.classList.remove('show'); });

/* Von außen (über Authentik angemeldet) gibt es einen Abmelde-Knopf; im Heimnetz (*.horsti.home) nicht */
if(!/\.horsti\.home$/.test(location.hostname)) document.getElementById('logoutBtn').style.display='flex';
const DEMO_STATE=JSON.parse(JSON.stringify(buildState()));   // Vorführboot als Vorlage „Beispiel“, bevor der Server-Stand geladen ist
loadFromServer();

/* ============================================================ LOOP ============================================================ */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
let t0=performance.now();
(function loop(now){ requestAnimationFrame(loop); const t=(now-t0)/1000;
  if(mode==='sim'){ connObjs.forEach(o=>{ if(o._flow){ o.dots.forEach((d,i)=>{ d.visible=true; const u=((t*0.35)+i*0.5)%1; o.curve.getPoint(u,d.position); }); } else o.dots.forEach(d=>d.visible=false); }); }
  renderer.render(scene,camera); })(t0);
setMode('view'); select(null); renderBoatSwitcher(); resetUndo();
</script>
